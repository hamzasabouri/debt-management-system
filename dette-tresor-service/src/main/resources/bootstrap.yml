spring:
  application:
    name: dette-tresor-service
  cloud:
    config:
      uri: http://configadmin:configpassword@localhost:8888
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka