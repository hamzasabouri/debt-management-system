server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/config/**
          filters:
            - StripPrefix=1
        - id: discovery-server
          uri: lb://discovery-server
          predicates:
            - Path=/eureka/**
        - id: discovery-server-static
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: role-service
          uri: lb://user-service
          predicates:
            - Path=/api/roles/**
        - id: login-service
          uri: lb://login-service
          predicates:
            - Path=/api/auth/**
        - id: dette-tresor-service
          uri: lb://dette-tresor-service
          predicates:
            - Path=/api/dette-tresor/**
        - id: dette-interieur-service
          uri: lb://dette-interieur-service
          predicates:
            - Path=/api/dette-interieur/**
        - id: meda-service
          uri: lb://meda-service
          predicates:
            - Path=/api/meda/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: gateway, health, info, metrics