server:
  port: 8084

spring:
  application:
    name: dette-tresor-service
  datasource:
    url: jdbc:postgresql://localhost:5432/dette_tresor_db2
    username: postgres
    password: 22122002
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# JWT Configuration (for validation)
jwt:
  secret: J5a6sOV25m4IMmhDfq+GUH095toHgMvx7umH0fEiyuCkHKxQS0nX1gN5/e9JaUJPOwx+Y0UGoWP+uPKtpIG6GA==
  expiration: 86400000 # 24 hours

# PDF Generation Configuration
pdf:
  output-directory: ./pdf-output
  template-directory: ./pdf-templates
  logo-path: static/images/logo.png

# Integration Configuration
integration:
  bam:
    base-url: http://localhost:9001
    timeout: 30000
  dtfe:
    base-url: http://localhost:9002
    timeout: 30000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

logging:
  level:
    com.microservices.dettetresor: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, swagger-ui
  endpoint:
    health:
      show-details: always

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html