spring:
  config:
    import: "optional:configserver:http://localhost:8888"
  application:
    name: user-service
  cloud:
    config:
      enabled: true
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

server:
  port: 8082